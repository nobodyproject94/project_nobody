org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Fix: Kotlin incremental compilation error "different roots" terjadi di Windows
# ketika project di drive D:\ sedangkan pub cache di C:\
# Menonaktifkan incremental compilation menyelesaikan masalah ini.
kotlin.incremental=false
